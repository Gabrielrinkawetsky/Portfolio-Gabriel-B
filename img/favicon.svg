<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- favicon: a marca do site (GR ligado + cursor) num quadrado marrom-escuro, nas cores do canto da hero;
       traço com o mesmo degradê da marca (branco → pêssego → laranja) e brilho laranja -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f0902"/>
      <stop offset=".6" stop-color="#4a1706"/>
      <stop offset="1" stop-color="#7a2a0a"/>
    </linearGradient>
    <radialGradient id="glow" cx=".85" cy=".95" r=".7">
      <stop offset="0" stop-color="#f26b1d" stop-opacity=".55"/>
      <stop offset="1" stop-color="#f26b1d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gr" gradientUnits="userSpaceOnUse" x1="4" y1="6" x2="44" y2="34">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".45" stop-color="#ffd2a8"/>
      <stop offset="1" stop-color="#ff9536"/>
    </linearGradient>
    <filter id="shine" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feFlood flood-color="#ff9536" flood-opacity=".6"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect width="64" height="64" rx="15" fill="url(#glow)"/>
  <g transform="translate(4.6 9.6) scale(1.12)" filter="url(#shine)">
    <path d="M21.9 10.2A12 12 0 1 0 27 20M27 32V8h5.5a6 6 0 0 1 0 12H17M31 20l7 12" fill="none" stroke="url(#gr)" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="42" y="27" width="6" height="5" rx="1" fill="#ff9536"/>
  </g>
</svg>
